name: Sea countdown

on:
  schedule:
    - cron: "17 * * * *"      # страховка: раз в час проверяем, что цикл жив
  workflow_dispatch:          # ручной запуск и само-перезапуск

permissions:
  contents: write             # сохранить state.json с id сообщения
  actions: write              # запустить следующий цикл

concurrency:
  group: sea-countdown        # одновременно работает только один цикл
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 358       # чуть меньше лимита GitHub в 6 часов
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Countdown loop (~5.8 h)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TARGET: "2026-11-17 07:00"
          TZ_NAME: "Europe/Kyiv"
          INTERVAL: "10"          # секунд между обновлениями
          MAX_RUN_SEC: "20700"    # 5 ч 45 мин, потом перезапуск
        run: python bot.py --loop

      - name: Save state.json (first run only)
        if: always()
        run: |
          git pull --rebase --autostash || true
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "sea-countdown-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "save message id"
            git push
          fi

      - name: Start next cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run countdown.yml --ref main
